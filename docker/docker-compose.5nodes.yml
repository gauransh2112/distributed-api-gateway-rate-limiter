# Distributed API Gateway — Supplementary 5-node cluster overlay
#
# Extends docker/docker-compose.cluster.yml by defining gateway-4 and gateway-5.
# Reuses the canonical Sprint 16 image, configuration conventions, and network without
# duplicating redis, backend, or gateway-1..3 service definitions.
#
# Usage:
#   # Validate merged 5-node topology:
#   docker compose -f docker/docker-compose.cluster.yml -f docker/docker-compose.5nodes.yml config
#
#   # Start complete 5-node cluster:
#   docker compose -f docker/docker-compose.cluster.yml -f docker/docker-compose.5nodes.yml up -d
#
#   # Stop cluster:
#   docker compose -f docker/docker-compose.cluster.yml -f docker/docker-compose.5nodes.yml down

name: gateway-cluster

services:

  gateway-4:
    build:
      context: ..
      dockerfile: Dockerfile
    image: distributed-api-gateway:1.0.0-SNAPSHOT
    container_name: gateway-4
    environment:
      GATEWAY_INSTANCE_ID: gateway-4
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GATEWAY_RATELIMIT_ALGORITHM: FIXED_WINDOW
      GATEWAY_RATELIMIT_REDIS_ENABLED: "true"
      GATEWAY_RATELIMIT_DEFAULTCAPACITY: "5"
    ports:
      - "18084:8080"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      gateway-net:
        aliases:
          - gateway
    restart: unless-stopped

  gateway-5:
    build:
      context: ..
      dockerfile: Dockerfile
    image: distributed-api-gateway:1.0.0-SNAPSHOT
    container_name: gateway-5
    environment:
      GATEWAY_INSTANCE_ID: gateway-5
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GATEWAY_RATELIMIT_ALGORITHM: FIXED_WINDOW
      GATEWAY_RATELIMIT_REDIS_ENABLED: "true"
      GATEWAY_RATELIMIT_DEFAULTCAPACITY: "5"
    ports:
      - "18085:8080"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      gateway-net:
        aliases:
          - gateway
    restart: unless-stopped

networks:
  gateway-net:
    driver: bridge
