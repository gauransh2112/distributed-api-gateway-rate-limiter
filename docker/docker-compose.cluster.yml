# Distributed API Gateway — three-node cluster
#
# Separate from docker-compose.yml, which starts Redis alone for local development and is
# referenced by the Redis Setup Guide. That workflow stays as documented; this file adds the
# clustered deployment beside it.
#
# Topology:
#
#     gateway-1 ─┐
#     gateway-2 ─┼── redis (shared)
#     gateway-3 ─┘
#
# Every Gateway runs the same image and the same configuration, differing only in the identity
# supplied through the environment. No node-specific code exists, so scaling means adding a
# service here, not changing the application.
#
# Usage:
#   mvn package -DskipTests
#   docker compose -f docker/docker-compose.cluster.yml up -d --build
#   docker compose -f docker/docker-compose.cluster.yml ps
#   docker compose -f docker/docker-compose.cluster.yml down

name: gateway-cluster

services:

  redis:
    image: redis:7.2-alpine
    container_name: gateway-cluster-redis
    # One Redis for the whole cluster. This is the point of the exercise: every Gateway instance
    # reads and writes the same rate limiting state, so a client cannot obtain a separate quota
    # per instance.
    command: redis-server --save "" --appendonly no
    networks:
      - gateway-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s

  backend:
    image: busybox:latest
    container_name: gateway-cluster-backend
    # Placeholder origin, present so the documented cluster topology is complete.
    #
    # The Gateway does not route to it yet: the `routing` package is part of the approved package
    # structure but is not implemented, so the Gateway currently terminates requests itself. This
    # service exists for routing to target once that package lands, and is deliberately inert
    # rather than wired up with undocumented behaviour.
    command:
      - sh
      - -c
      - 'mkdir -p /www && echo "backend-ok" > /www/index.html && httpd -f -v -p 8080 -h /www'
    networks:
      - gateway-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  gateway-1:
    build:
      context: ..
      dockerfile: Dockerfile
    image: distributed-api-gateway:1.0.0-SNAPSHOT
    container_name: gateway-1
    environment:
      # Gateway Identity, per the Configuration Reference: identity comes from the environment,
      # never from code, which is why one image serves every node.
      GATEWAY_INSTANCE_ID: gateway-1
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Distributed rate limiting on, so the cluster demonstrably shares state. Set here rather
      # than in application.yml to leave the application's own safe defaults untouched.
      GATEWAY_RATELIMIT_ALGORITHM: FIXED_WINDOW
      GATEWAY_RATELIMIT_REDIS_ENABLED: "true"
      GATEWAY_RATELIMIT_DEFAULTCAPACITY: "5"
    ports:
      - "18081:8080"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      gateway-net:
        # Shared alias across all three instances: resolving "gateway" returns every instance's
        # address and Docker's embedded DNS rotates between them, which is the documented
        # load-distribution mechanism. No reverse proxy is introduced; the architecture is
        # load-balancer-agnostic and the Gateway is stateless, so no sticky sessions are needed.
        aliases:
          - gateway
    restart: unless-stopped

  gateway-2:
    build:
      context: ..
      dockerfile: Dockerfile
    image: distributed-api-gateway:1.0.0-SNAPSHOT
    container_name: gateway-2
    environment:
      GATEWAY_INSTANCE_ID: gateway-2
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GATEWAY_RATELIMIT_ALGORITHM: FIXED_WINDOW
      GATEWAY_RATELIMIT_REDIS_ENABLED: "true"
      GATEWAY_RATELIMIT_DEFAULTCAPACITY: "5"
    ports:
      - "18082:8080"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      gateway-net:
        # Shared alias across all three instances: resolving "gateway" returns every instance's
        # address and Docker's embedded DNS rotates between them, which is the documented
        # load-distribution mechanism. No reverse proxy is introduced; the architecture is
        # load-balancer-agnostic and the Gateway is stateless, so no sticky sessions are needed.
        aliases:
          - gateway
    restart: unless-stopped

  gateway-3:
    build:
      context: ..
      dockerfile: Dockerfile
    image: distributed-api-gateway:1.0.0-SNAPSHOT
    container_name: gateway-3
    environment:
      GATEWAY_INSTANCE_ID: gateway-3
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GATEWAY_RATELIMIT_ALGORITHM: FIXED_WINDOW
      GATEWAY_RATELIMIT_REDIS_ENABLED: "true"
      GATEWAY_RATELIMIT_DEFAULTCAPACITY: "5"
    ports:
      - "18083:8080"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      gateway-net:
        # Shared alias across all three instances: resolving "gateway" returns every instance's
        # address and Docker's embedded DNS rotates between them, which is the documented
        # load-distribution mechanism. No reverse proxy is introduced; the architecture is
        # load-balancer-agnostic and the Gateway is stateless, so no sticky sessions are needed.
        aliases:
          - gateway
    restart: unless-stopped

networks:
  # One user-defined bridge network. Services address each other by service name through Docker's
  # embedded DNS, so no host networking and no hardcoded addresses are involved.
  gateway-net:
    driver: bridge
