server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: distributed-api-gateway
  lifecycle:
    timeout-per-shutdown-phase: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.gauransh.gateway: INFO
