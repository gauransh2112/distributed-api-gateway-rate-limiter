server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: distributed-api-gateway
  lifecycle:
    timeout-per-shutdown-phase: 30s
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      connect-timeout: 2000ms
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  # The Gateway's identity appears in every log line, so output from a cluster can be attributed to
  # the instance that produced it. Identity is supplied by the environment (Gateway Identity, per
  # the Configuration Reference) and defaults to a local value, so a single-instance run is
  # unaffected. No application code reads it: one image serves every node.
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [${GATEWAY_INSTANCE_ID:gateway-local}] [%t] %-40.40logger{39} : %m%n"
  level:
    root: INFO
    com.gauransh.gateway: INFO
